name: safecheck

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safecheck}
      POSTGRES_USER: ${POSTGRES_USER:-safecheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  inference:
    build: ./safecheck-inference
    restart: unless-stopped
    environment:
      MODEL_DIR: /app/models
      USE_CUDA: ${USE_CUDA:-0}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env}
    volumes:
      - ./safecheck-inference/models:/app/models:ro
    expose: ["8000"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-safecheck}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-safecheck}?schema=public
      INFERENCE_URL: http://inference:8000
      INFERENCE_API_KEY: ${INFERENCE_API_KEY:?Set INFERENCE_API_KEY in .env}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      inference: { condition: service_healthy }

volumes:
  postgres_data:
